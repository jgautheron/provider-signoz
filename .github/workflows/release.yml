# Publish the provider package to xpkg.upbound.io/jon on a v* tag.
# Requires two repo secrets from an Upbound API token (Upbound console →
# Account Settings → API Tokens): UPBOUND_ACCESS_ID + UPBOUND_TOKEN — used as
# the docker registry username + password for xpkg.upbound.io.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0). Defaults to the tag.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install crossplane + up CLIs
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build all platforms
        run: make build.all PLATFORMS="linux_amd64 linux_arm64" VERSION=${{ steps.v.outputs.version }}
      - name: Login to xpkg.upbound.io
        run: |
          echo "${{ secrets.UPBOUND_TOKEN }}" | docker login xpkg.upbound.io \
            --username "${{ secrets.UPBOUND_ACCESS_ID }}" --password-stdin
      - name: Push multi-arch package
        run: |
          V=${{ steps.v.outputs.version }}
          up xpkg push \
            -f _output/xpkg/linux_amd64/provider-signoz-${V}.xpkg \
            -f _output/xpkg/linux_arm64/provider-signoz-${V}.xpkg \
            xpkg.upbound.io/jon/provider-signoz:${V}
